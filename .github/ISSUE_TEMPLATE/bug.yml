name: Bug in scripts or viewer
description: A check, build script or the web viewer is behaving wrongly.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please say how to reproduce the problem. For a check failure, paste the relevant output (not a screenshot only).
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - A check or build script (`scripts/validate.py`, `run_checks.sh`, and so on)
        - The web viewer (`WebUI/`)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, a branch or commit if you have one, and any check output.
    validations:
      required: true
