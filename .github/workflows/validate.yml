name: validate

on:
  pull_request:
  push:
    branches: ['**']   # every pushed branch is checked (work goes to branches; main only on explicit approval)

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorldWar2
    steps:
      - uses: actions/checkout@v4
      # Depth 1 of the pull-request base (or of main, on a push) is enough for git show of that tree
      # and for the renumber stress test, which resolves origin/main here and installs a local
      # 'base' ref inside its temp clone (CI has no local main branch).
      # pull_request, not pull_request_target: no secrets, read-only token, safe for forks.
      - name: Fetch origin/main for id checks
        working-directory: .
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}":refs/remotes/origin/main
          else
            git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate claims and units
        run: python scripts/validate.py
      - name: JSON-in-cell fields match schema/json schemas
        run: python scripts/check_json_fields.py
      - name: Coordinate checks (warnings only)
        run: python scripts/check_coordinates.py
        continue-on-error: true
      - name: Temporal audit of command relationships (read-only, non-failing)
        run: python scripts/audit_temporal_relationships.py
        continue-on-error: true
      - name: Build combined outputs
        run: python scripts/build.py
      # build/ holds the generated tables (claims, places, coverage, command relations, reference links); docs/coverage.md and data/references.csv are generated too
      - name: Check build/ is up to date
        run: |
          python scripts/build.py --check
          if [ -n "$(git status --porcelain -- build docs/coverage.md data/references.csv)" ]; then
            echo "build/ differs from the committed files; run 'python scripts/build.py' in WorldWar2/ and commit the result"
            git status --porcelain -- build docs/coverage.md data/references.csv
            git diff --stat -- build
            exit 1
          fi
      # fails the build: the answers of who_controls.py for four command scenarios (scripts/semantic_tests.py)
      - name: Semantic tests (command scenarios)
        run: python scripts/semantic_tests.py
      - name: Renumber-script fixture tests
        run: python scripts/test_renumber_new_ids.py
      - name: Renumber-script stress and property tests
        run: python scripts/test_renumber_new_ids_stress.py
      # After rebase onto an updated main, a second PR that reused the same new ids fails here.
      - name: Id collision checks against origin/main
        run: |
          python scripts/check_claim_ids.py
          python scripts/check_mission_ids.py
          python scripts/check_commander_ids.py
          python scripts/check_other_ids.py
