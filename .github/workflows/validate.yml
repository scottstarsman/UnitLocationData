name: validate

on:
  pull_request:
  push:
    branches: ['**']   # every pushed branch is checked (work goes to branches; main only on explicit approval)

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorldWar2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate claims and units
        run: python scripts/validate.py
      - name: JSON-in-cell fields match schema/json schemas
        run: python scripts/check_json_fields.py
      - name: Coordinate checks (warnings only)
        run: python scripts/check_coordinates.py
        continue-on-error: true
      - name: Temporal audit of command relationships (read-only, non-failing)
        run: python scripts/audit_temporal_relationships.py
        continue-on-error: true
      - name: Build combined outputs
        run: python scripts/build.py
      # build/ holds the generated tables (claims, places, coverage, command relations, reference links); docs/coverage.md and data/references.csv are generated too
      - name: Check build/ is up to date
        run: |
          python scripts/build.py --check
          if [ -n "$(git status --porcelain -- build docs/coverage.md data/references.csv)" ]; then
            echo "build/ differs from the committed files; run 'python scripts/build.py' in WorldWar2/ and commit the result"
            git status --porcelain -- build docs/coverage.md data/references.csv
            git diff --stat -- build
            exit 1
          fi
      # fails the build: the answers of who_controls.py for four command scenarios (scripts/semantic_tests.py)
      - name: Semantic tests (command scenarios)
        run: python scripts/semantic_tests.py
